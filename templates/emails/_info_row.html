{# Include with {% include "emails/_info_row.html" with label=... value=... %} #}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:2px;">
  <tr>
    <td style="padding:9px 0;border-bottom:1px solid rgba(11,11,11,.08);font-size:13px;color:#666;">{{ label }}</td>
    <td style="padding:9px 0;border-bottom:1px solid rgba(11,11,11,.08);font-size:13px;color:#0B0B0B;font-weight:700;text-align:right;">{{ value }}</td>
  </tr>
</table>
