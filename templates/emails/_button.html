{# Include with {% include "emails/_button.html" with url=... label=... %} #}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0;">
  <tr>
    <td style="background-color:#F2E900;">
      <a href="{{ url }}" style="display:inline-block;padding:14px 28px;font-size:13px;font-weight:800;color:#0B0B0B;text-decoration:none;text-transform:uppercase;letter-spacing:.04em;">{{ label }}</a>
    </td>
  </tr>
</table>
